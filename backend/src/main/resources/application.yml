server:
  port: 8080

spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/nattlabs
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
  mail:
    from: ${APP_MAIL_FROM:}
    to: ${APP_CONTACT_TO:support@nattlabs.com}
