services:
  mongo:
    image: mongo:7
    container_name: nattlabs-mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - nattlabs_mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: nattlabs-backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/nattlabs
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp-relay.brevo.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_CONTACT_TO: ${APP_CONTACT_TO:-support@nattlabs.com,careers@nattlabs.com}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    ports:
      - "8090:8080"

volumes:
  nattlabs_mongo_data:
